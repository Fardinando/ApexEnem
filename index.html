    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "O ApexEnem é gratuito?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. O plano Free dá acesso ao banco de questões reais do ENEM, à correção de redação por IA, aos simulados cronometrados, à geração de aulas em texto, à pesquisa de repertórios e às salas de competição. As ações que consomem IA usam uma carteira de moedas que recarrega semanalmente. Planos pagos ampliam o limite de uso para quem precisa estudar em alto volume."
          }
        },
        {
          "@type": "Question",
          "name": "Preciso instalar algum aplicativo?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Não. O ApexEnem roda inteiro no navegador — Chrome, Edge, Firefox, Safari — tanto no computador quanto no celular. A interface é responsiva, então você pode começar uma redação no notebook e revisar depois no celular sem perder nada: tudo fica salvo na sua conta."
          }
        },
        {
          "@type": "Question",
          "name": "Quão confiável é a correção de redação por IA?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A correção segue literalmente a Cartilha do Participante do ENEM 2025 e aplica as regras oficiais de pontuação por competência (0, 40, 80, 120, 160 ou 200). Nenhum corretor automático substitui 100% um corretor humano, mas o diagnóstico sobre competências e os pontos específicos a melhorar são precisos o suficiente para guiar seus estudos."
          }
        },
        {
          "@type": "Question",
          "name": "A nota do simulado é parecida com a do ENEM real?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A nota do simulado é calculada pelo método TRI (Teoria de Resposta ao Item), o mesmo que o INEP usa. A estimativa reflete não só quantas questões você acertou, mas quais — errar questões fáceis puxa a estimativa pra baixo. Em geral a nota do simulado fica dentro de uma margem de ±30 a 50 pontos em relação à que você faria no exame real."
          }
        },
        {
          "@type": "Question",
          "name": "Posso me cadastrar sendo menor de idade?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A partir dos 13 anos, sim. Entre 13 e 17 anos é obrigatório informar o e-mail de um responsável legal e declarar o consentimento dele no momento do cadastro — exigência da LGPD (Art. 14) e do Estatuto Digital da Criança e do Adolescente (Lei nº 15.211/2025)."
          }
        },
        {
          "@type": "Question",
          "name": "O ApexEnem tem vínculo com o INEP ou com o MEC?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Não. O ApexEnem é um projeto independente, criado por uma pequena equipe de desenvolvedores e educadores. ENEM® é marca registrada do INEP e é usada aqui apenas em caráter descritivo, para indicar que a plataforma prepara para esse exame."
          }
        }
      ]
    }
